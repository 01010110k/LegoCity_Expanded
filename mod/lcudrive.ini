[boats]
; [boats2] The traffic boats (boats.h, Notes 56 section 8). Stock, the game adds every traffic boat on the lane
; nearest the camera, one spacing behind the last, and faster boats queue behind slower ones (one lane each way,
; no overtaking): a procession that follows you. 0 = the stock boat traffic.
enable     = 1
spawn_gap  = 1.6     ; x the boat map's spawn spacing (1 = stock 16 / 8; 1.0 .. 2.5): new boats only where no
                     ; other vehicle is that much farther away -> one or two per lane near you, not a file
files      = 1       ; 1 = a boat that keeps following another one (same way, `follow` u behind, `lat` u off its
                     ;     line) for `hold` s fades out, the one at the back first; the game puts the next one elsewhere
follow     = 40      ; u
lat        = 7       ; u
align      = 25      ; degrees: "the same way"
hold       = 4       ; s
keep       = 35      ; u: never a boat this close to a player
fade_view  = 60      ; u: a boat in full view goes only from this far (out of view: from `keep`)
gap_s      = 1.5     ; s between two fades
cap        = 8       ; at most this many traffic boats within cap_radius of the players (0 = no cap)
cap_radius = 150     ; u
log        = 1       ; 1 = a line per fade + a summary every 30 s (lcudrive.log, ">>> boats:")

[spots]
; Life at the new places (Port Atlas, Woods West, the brick sets): people standing, looking, taking
; photos, chatting and strolling at each place, parked cars, and a car driving the Woods West road.
; They appear while a player is near a place and go when everybody has left; none during story
; missions; nothing appears, goes or is told to do anything for 4 s after a teleport (the train
; tunnels, fast travel). 0 = none of it
enable       = 1
people       = 1        ; 1 = people at the places (0 = cars only)
max_people   = 10       ; at once, everywhere (up to 16)
per_spot     = 4        ; at one place (each place also has its own count in the data)
near         = 55       ; u from a place: a player this close fills it
far          = 85       ; u: nobody this close -> its people go
min_spawn    = 12       ; u: nobody appears closer to a player than this
walk         = 0.35     ; how much they stroll between a place's points (0 = they stay where they stand ... 1)
walk_speed   = 1.0      ; how fast they stroll, u/s (0.3 ... 2; the game's own walk-to is 0.8-1; slower looks like sneaking)
night        = 0.5      ; the share of each place's people out after dark (0 = nobody ... 1 = as by day)
invulnerable = 1        ; 1 = they cannot be knocked apart (as the game's own scripted bystanders)
cars         = 1        ; 1 = the parked cars (castle turning circle, lookout, seaport, station). They
                        ;     follow the [sites] rules (near / far / park); no map pin; get in and they are yours
drive        = 8        ; cars driving a route: how many of the data's routes are driven (0 = none; all 3 now: Woods West road, Wilds Road, Saltwind bus)
drive_speed  = 1.0      ; x each route's own speed (0.3 .. 2.5)
log          = 0        ; 1 = a line every 10 s per driving car in lcudrive.log (steer / throttle / speed)
; The data ("life spots": places, their points, parked cars, routes) is built in. A file of this name
; beside lcudrive.ini replaces it - copy lcudrive_spots.default.txt to it and edit; the format is at the
; top of that file and in Notes\51. Ctrl+Alt+R (or Reload Settings File) reads it again.
file         = lcudrive_spots.txt

[backrooms]
; The Backrooms (World\backrooms, Notes 54): the little ochre house on top of the Outport headland has a door
; with nothing behind it - walk in on foot and you fall into an endless yellow maze far below the sea. While
; anyone is down there: no music, no radio, no weather, the mod's spawners keep quiet. Find an EXIT door (they
; turn up more often after a while), or use "Leave the Backrooms" in the pause menu (Bikes and Jetpack page).
enable    = 1       ; 0 = the village door is only a door (anyone inside is brought out at once)
statues   = 1       ; the watching statues (0 = none)
colossi   = 0       ; [br4] the SCALED-ACTOR colossi (0: the pool halls' giants are brick-built and perfectly still now; 1 also spawns the old actors - unproven)
effects   = 1       ; the camcorder overlay at all (0 = the game's own picture; nothing written to the shaders)
handicam  = 1       ; the camcorder look (0 = only the yellow grade, the vignette and a slow wobble)
intensity = 2       ; how strong the camcorder look is: 0 .. 3
pillarbox = 0       ; 1 = 4:3 black bars
blink_ms  = 120     ; the black moment at a doorway crossing, ms (0 = none; up to 400)
visit     = 0       ; change to 1 = both players are dropped in now (testing; back to 0 afterwards)
leave     = 0       ; change to 1 = out at once, both players at the village (menu: Leave the Backrooms)
file      = lcudrive_backrooms.txt   ; an edited copy of World\backrooms\out\portals.txt beside the DLL overrides the built-in table
; [fix1] the arrival is logged every 0.25 s while it lasts (position, fall speed, the engine's on-ground and
; ground probe, the level the character belongs to) - lcudrive.log ">>> backrooms" / "    backrooms" lines
trace     = 1       ; 0 = only the landing / retry / give-up lines
; [fix2] the camera through a connector. blink_ms above is now the LONGEST black at a crossing: it ends as soon
; as the camera has caught up (lcudrive.log: one ">>> backrooms: player N through connector ..." line per crossing).
portal_snap  = 2     ; 2 = the engine's own camera cut (what it does after a respawn), 1 = only its snap flag, 0 = none
portal_hold  = 1     ; 1 = the picture is drawn from where the camera belongs until the game's camera is there
portal_black = 1     ; 1 = black from the crossing until the camera has caught up (at most blink_ms)
portal_catch = 1.0   ; u: how close the game's camera must be to count as caught up
workers   = 1       ; [br3] calm people in white at the consoles of the rare lab rooms (they never react; 0 = none)
vehicles  = 1       ; [br3] the game's own pump cart stood in the rail rooms (0 = none; it goes if the engine moves it)
freeze    = 1       ; [freeze] statues, colossi and workers hold perfectly still (0 = the engine's idle breathing)
worker_repose = 1   ; [freeze] a worker takes a new pose now and then (every 30-90 s) while nobody looks (0 = never)
; [br4 2026-11-24] the goal, the easy way out (the maze's own rates live in the table: lcudrive_backrooms.txt param lines)
vault_studs = 50000000    ; [br5] studs for the bank on walking into the vault with every gold brick found (0 = none; the bank stops at 999,999,999,999)
; (goal_studs, br4's 25,000, is no longer read)
easy_out_buttons = LB+RB  ; hold these together for 3 s = both players leave the Backrooms (A B X Y LB RB LS RS BACK START DUP DDOWN DLEFT DRIGHT LT RT; NONE = off)
easy_out_key = 8          ; the keyboard's: hold this virtual key (8 = Backspace) for 3 s (0 = off)
hud = 1                   ; the brick counter, the arrows and the 'how to leave' reminder on screen (0 = none)

[weather]
; Rain, fog and weather zones (Notes\53). Everything at 0 / off = the game exactly as it was.
;   rain   falls on the screen (main-filter shaders, through 3Dmigoto) and greys the light
;   fog    drives the engine's own height fog: a veil that closes in with distance plus a thick
;          layer pooling near the ground. Thinner after dark (night_fog) so nights stay playable.
;   zones  places with their own weather (lcudrive_weather.txt: the dreary village). A zone reaches
;          radius + falloff from its centre and not one unit further.
; The pause menu's Weather page sets rain, fog, zones and engine_rain.
enable       = 1        ; 0 = none of it
rain         = 4        ; everywhere: 0 off, 1 drizzle, 2 rain, 3 storm, 4 changing (clear spells, clouds, showers come and go)
fog          = 0        ; everywhere: 0 off, 1 light, 2 heavy
zones        = 1        ; "Village Weather": 1 = the zones of the file below have their own weather
engine_fog   = 1        ; 1 = fog through the engine's height fog (0 = only the screen's grey light and mist)
engine_rain  = 0        ; EXPERIMENTAL, 1 = also switch on the engine's own 3D rain (drops and splashes)
                        ;     never yet seen running: if rain looks wrong or the game misbehaves, back to 0
screen_rain  = 1        ; 1 = the rain streaks and lens drops drawn on the screen
overcast     = 1.0      ; x the grey, flat light under rain and fog (0 = keep the sunny colours ... 2)
mist         = 1.0      ; x the drifting veils across the screen in fog (0 = none ... 2)
blend        = 4        ; seconds the weather takes to change (walking into a zone, a menu change)
night_fog    = 0.6      ; the share of the fog kept after dark (1 = as thick as by day)
vis_light    = 150      ; u: light fog - how far you see before the veil has taken ~90 %
vis_heavy    = 48       ; u: heavy fog (a street is ~10 u wide; a figure is 0.65 u tall)
low_light    = 0.04     ; light fog: how dense the layer near the ground is
low_heavy    = 0.12     ; heavy fog
thick_light  = 12       ; u: light fog: how high the ground layer reaches before it thins
thick_heavy  = 7        ; u: heavy fog
weird        = 0.45     ; a zone's "weird" spots: sight x (1 - this), ground fog x (1 + 2 x this)
shower       = 360      ; seconds for one turn of a zone's rain (it rains the zone's share of it)
spell        = 300      ; s: rain 4 (changing): how long one spell of weather lasts (60 ... 3600)
wet_share    = 0.3      ; rain 4: the share of the spells with rain in them (0 ... 1)
log          = 0        ; 1 = a line every 5 s per view in lcudrive.log (place, the mix, what was written)
; The zones. No file, or a file with only comments = no zones. The format is at the top of
; lcudrive_weather.default.txt; tools\make_weather.py writes the file from a sites.json.
; Ctrl+Alt+R (or Reload Settings File) reads it again.
file         = lcudrive_weather.txt

[gfx]
; The graphics overhaul (Notes\57). The pause menu's City and Lights page has Graphics and Camera Feel.
;   preset   0 = Stock (nothing of this is written: the game as before), 1 = Enhanced, 2 = Performance
;            Enhanced: colour graded by the time of day in the game's own colour stage (warm golden hour,
;            blue hour, neutral noon, cool night with warm lamps), firmer ambient occlusion, objects drawn
;            further away, a rim light on the figures at night, a light haze in the distance, god rays in
;            high quality, and a subtle lens (sharpening, colour fringes at the edges, vignette, grain).
;            Performance: the grade and the sharpening stay; no ambient occlusion, objects culled nearer,
;            no haze / fringes / grain.
; The numbers below are "x the preset": 1 = as designed, 0 = that part off.
preset        = 1
grade         = 1.0     ; the time-of-day colour grade (0 .. 2)
ao            = 1.0     ; the change to ambient occlusion (0 .. 2)
detail        = 1.0     ; the change to how far objects are drawn (0 .. 2; costs some frame time)
rim           = 1.0     ; the rim light on figures after dark (0 .. 2)
haze          = 1.0     ; the distance haze (0 .. 2; only where the level has its own height fog)
haze_dist     = 400     ; u: the haze reaches its full depth this far away
aberration    = 1.0     ; colour fringes toward the screen edges (0 .. 3)
sharpen       = 1.0     ; sharpening (0 .. 2.5)
vignette      = 1.0     ; darker corners (0 .. 2.5)
grain         = 1.0     ; film grain (0 .. 4)
heat          = 0       ; heat shimmer low on the screen round noon (0 = off .. 2)
; ---- gfx2 (Notes\57 section 9): more of the look, each with its own switch. All of it follows the Graphics
; preset above (Stock = none of it; Performance keeps the bloom and the moonlight, which are free).
bloom         = 1       ; the game's own bloom, tuned by the time of day: restrained by day, a soft glow round
                        ; lamps, windows and neon after dark (pause menu: Driving > Night Glow)
bloom_scale   = 1.0     ; x that change (0 .. 2)
far_blur      = 1       ; a very light blur on the far distance only (pause menu: Co-op > Distance Blur).
                        ; Off in split-screen. Nothing nearer than far_blur_start is ever touched.
far_blur_scale = 1.0    ; x the blur (0 .. 2; 1 = about two pixels at the horizon)
far_blur_start = 140    ; u: where it begins (never nearer than 60)
far_blur_full  = 420    ; u: where it reaches its full, small radius
sun_rays      = 1       ; rays of light past roof edges toward the sun, and a small lens flare when you look
                        ; at it (pause menu: Driving > Sun Rays). Off in split-screen.
sun_rays_scale = 1.0    ; x the rays (0 .. 2)
flare_scale   = 1.0     ; x the lens flare (0 .. 2; 0 = rays only)
moonlight     = 1       ; a cool, even floor of light at night so nothing is pitch black
moonlight_scale = 1.0   ; x that floor (0 .. 2)
ray_traced    = 0       ; EXPERIMENTAL ray-traced light: rays through the picture add bounced light (colour from lit
                        ;     walls and streets) and shade corners and the ground under things. One player only; costs frames
ray_traced_scale = 1.0  ; x its strength (0 .. 2)
reflections   = 1       ; the wet roads mirror the city a little more while it rains
reflections_scale = 1.0 ; x that (0 .. 2)
split_fx      = 0       ; 1 = far blur / sun rays / flare in split-screen too (untested there: they take their
                        ; camera from whichever half was drawn last)
; The frame counter (pause menu: Co-op > Frame Counter): frames per second, the average and the worst frame
; time of the last second, in the top left corner.
fps           = 0
; Auto (pause menu: Co-op > Auto Graphics): while the frame rate stays under auto_target the effects step
; down - first sun rays / flare / far blur / fringes / grain, then the extra draw distance and haze, then
; ambient occlusion - and come back, one step at a time, when there is room again.
auto          = 0
auto_target   = 60      ; frames per second to hold (30 .. 165)
; Camera feel: a little life in the camera, as in GTA / RDR - a slow handheld sway when you stand, a lean
; and a touch of lag into turns, a step bob when walking, a dip when you land or crash. Added to the
; picture only: aiming, controls and the game's own camera are not touched.
camera        = 1       ; 0 off, 1 subtle, 2 strong
camera_scale  = 1.0     ; x all of it (0 .. 2)
bank_sign     = 1       ; 1 or -1: if the camera leans OUT of turns instead of into them, set -1
; ReShade's LCU_DayNightCycle (the old grade, its own clock) and this grade would double up: while that
; technique is on, the engine grade stays off. 0 = grade anyway.
reshade_aware = 1
; [fix1] the far plane: the sky dome is a world-fixed mesh round the map centre, so far out (the Outport, the
; Wilds) its far side was cut off. Far out only, the RENDER copy of a player's camera gets a far plane that
; covers the dome: (distance from the centre + far_dome) x 1.05, at most far_max; nearer in nothing changes.
far_fix   = 1       ; 0 = the game's far plane everywhere
far_from  = 600     ; u from the map centre (x, z) before anything is raised
far_dome  = 1600    ; u, the dome's radius as drawn
far_max   = 6000    ; u, never further

[npc]
; [round3] The city's people speak (Notes 62): passers-by greet you, recognise Chase McCain, gasp at your jumps and
; crashes, grumble when you bump them (and glare if you do it again), shout when a police chase tears past, notice
; your costume and odd rides, talk about the weather, the hour and the new places, and you overhear their small talk.
; 14 voices, 904 lines; no line twice within the hour while others fit.
enable     = 1     ; 0 = the whole NPC overhaul off (voices and the street-life re-weighting)
voices     = 1     ; 0 = no NPC lines at all (pause menu: Co-op > People Talk)
reactions  = 1     ; lines when something happens near people (crashes, punches, jumps, near misses, chases, bumps)
greetings  = 1     ; passers-by greeting you, fans
smalltalk  = 1     ; overheard conversations, phone calls, weather and time remarks, gossip
subtitles  = 0     ; 1 = show their lines as subtitles (route game only)
per_hour   = 150   ; at most this many NPC lines an hour, both players together (pause menu: Co-op > How Chatty)
hear       = 24    ; u: lines further than this from both players are not spent
chat_every = 45    ; s between overheard conversations, on average
max_loaded = 6     ; voice banks kept loaded (about 1 MB each)
route      = auto  ; game = the game's own dialogue system (needs the round3 PATCH.DAT) | xaudio = lcudrive's own
                   ; audio from the npc_vo folder beside lcudrive.dll | auto = game, and xaudio if the game does not
                   ; take the voice banks (the log says so)
volume     = 1.0   ; x the xaudio route's level
life       = 1     ; street-life scenes weighted by the hour, the weather and the place (stage 2)
spots      = 1     ; the people at the new places say a line now and then (stage 4)
table      = npc_runtime.tsv
vo_dir     = npc_vo

[animals]
; [round3] Animals (Notes 64): rabbits, goats, ducks, frogs, gulls, crabs, crows, a sleeping bear, owls and bats at
; night in the Wilds; chickens, pigs, cows and goats at Saltwind Farm; gulls and crabs on the beaches; gulls and
; pigeons at Port Atlas. They graze, wander, run off or fly away when you come close, and are back a minute later.
; Harmless: they never attack, and nothing can hurt them. The herds are in lcudrive_animals.txt beside this file.
enable       = 1     ; 0 = no animals (pause menu: Co-op > Animals)
max          = 10    ; at once, everywhere (0..16)
per_herd     = 6     ; at one herd
near         = 70    ; u: a player this close to a herd fills it...
min_spawn    = 25    ; u: ...only while every player is further than this from the herd (no popping up)
far          = 100   ; u: nobody this close -> they go
shy          = 1.0   ; x how close you may come before they run or fly off (0 = never)
respawn      = 60    ; s: a bird that flew off is back after this
invulnerable = 1
file         = lcudrive_animals.txt

[maplabels]
; [labels1] The new places on the city map (Notes 59 section 6). Pins (icons you can select on the pause map) for
; Port Atlas, Woods West, Herring Cove, the Wilds and its regions, Saltwind Downs, the stations, the Sky Rail, the
; marinas and boat posts and some landmarks; and the map's location line names the new places. The pins come from
; PATCH.DAT (mappins.txt) and need this DLL to place them; the map builds its pins when the city loads, so pins_*
; changes take effect after a restart (or reloading a save). No menu row (ini only).
enable         = 1   ; 0 = none of it (read at startup)
label          = 1   ; the location line on the map / communicator names the new places
pins_districts = 1   ; the 12 district / region pins
pins_places    = 1   ; stations, Sky Rail, Kestrel Lodge, fire tower, windmill, King's Castle, Modular Street
pins_boats     = 1   ; Atlas Marina, Fresco Marina and the three other boat posts

[menu]
; Mod Options: a row right after Options in the game's pause menu, with the settings above (driving,
; bikes, aircraft, police, radio, lights, co-op). A change made there is saved into this file - its
; comments kept - when you leave the page, resume, or after a second, and is in effect when you resume.
enable = 1               ; 0 = no Mod Options row in the pause menu (the ini still works); read at startup

[diycars]
; [diycars1] DIY cars (Notes 71): cars you built from LEGO bricks (World\diycars: an LDraw model + car.ini -> diycars.py
; -> PATCH.DAT). They wait in a row at the garage like any [sites] stand: walk up, get in, it is yours. Their
; handling is their own (car.ini [stats] -> the vehicle's definition; lcudrive builds on it as for every car).
; garage = x, y, z, heading [, label]   the first car's spot (y = the ground), the row goes to the cars' right
;          shipped: the waterfront promenade south of the police station, verified offline (World\diycars\garage_probe.py,
;          Notes 71 section 9): 3 cars facing north, flat (3.350..3.352), clear of props, 12.6+ u from the traffic lanes
; cars    = the vehicle names diycars.py printed (SmallCars_CraterDIY1, ...; at most 8). A name the game does
;           not have (no DIY PATCH installed) is logged once and skipped, like any stand's
enable  = 1
spacing = 4.5
garage  = -171.75, 3.35, -245.25, 0, Police station promenade DIY garage
cars    = SmallCars_CraterDIY1

[debug]
; one state line in lcudrive.log every N frames while you drive (0 = off; 60 = once a second)
log_every = 60
