;            least 5 u from any quay or rock. Anything else: y = the ground it stands on (it is put down
;            0.3 above it), on flat ground with 5 u clear around it (a helicopter: nothing above it)
;   heading  degrees, which way its nose points: 0 = +z, 90 = +x (east), 180 = -z, 270 = -x
;   label    your own words, for the log (optional)
