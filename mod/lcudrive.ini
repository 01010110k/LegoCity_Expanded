[shark]
; The deep-water shark (World\shark, Notes 61). In the stock game swimming out over deep water means the
; shark at once. Now you can swim anywhere - across the bays, out to the islands. Only a really long swim
; without touching ground, a pier or a boat has a small chance of the shark, and that chance grows slowly.
; Shallow water near a shore never has a shark. Each player has their own clock (co-op).
; ([world] safe_sea below still keeps the sea round Port Atlas free of sharks altogether.)
enable         = 1      ; 0 = the game's own shark (lcudrive does not touch it; restart to change)
classic        = 0      ; 1 = the game's own rule while lcudrive runs (pause menu: Sharks = Classic)
grace_s        = 180    ; s of non-stop deep-water swimming before there is any chance at all
