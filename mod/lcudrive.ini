[sites]
; Vehicles waiting at stands - the way in and out of Port Atlas. While a player is within `near` of a
; stand, its vehicle appears there and waits (a map pin on it); get in and it is yours. Leave it on its
; stand and it waits again; leave it somewhere else and it goes once nobody is within `leave` of it for
; 10 s, and a fresh one waits on the stand. One that nobody is near (`far`) goes. None appear during story
; missions. A vehicle is never taken away while a player is in it or within 8 u of it. 0 = no stands
enable  = 1
