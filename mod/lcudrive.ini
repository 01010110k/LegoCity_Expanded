; GTA-style street life. Every so often a few of the citizens near you stop being background
; walkers and play a scene: a conversation, a phone call, tourists taking photos, a queue at the
; cash machine, a workout class, a street dance, a busker with a little crowd, cops on a break,
; fans who recognise you, an argument (a third turn into fist fights with onlookers - the one who
; starts it can be arrested), a pickpocket who snatches and runs (a cop in the crowd may give
; chase; tackle him yourself and he's arrestable), a jogging club that really runs, the odd gag.
; Beach life at Paradise Sands, by day sunbathing and by night a party; joggers and workouts in
; the morning park, dancing in the plazas at night. When a scene ends they walk off and blend back
; into the crowd. No new scenes during story missions or while you're wanted.
