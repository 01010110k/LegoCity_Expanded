; ---- the music: the radio's own AI songs, or yours -------------------------------------------------
; Every station keeps its DJ, station IDs, call-ins, ads and news. Only the music changes:
;   ai       the radio's own AI-generated songs (the default)
;   library  your music files: each station plays the ones whose genre tag fits it (rock on Crash
;            Radio, reggae on Paradise Sound...). The DJ talks between your tracks.
;   service  whatever your music app is playing: Spotify, Apple Music, TIDAL, Amazon Music, Deezer,
;            Media Player... any app that shows in Windows' media controls. The DJ talks BETWEEN
;            tracks with your app paused, never over it. The radio can't pick what your app plays,
;            so the genre does NOT follow the station by itself: all service stations share your
;            one app, and switching from Crash Radio to Bluebell Country keeps the same music
;            playing under a new DJ. Ctrl+Alt+; opens the tuned station's playlist in the app (its
;            playlist_ link, or the built-in genre list below for Spotify); you press play there.
;            Only `library` puts the right genre on every station automatically.
;   talk     no music: just the DJ, IDs, ads and news
; Brick Talk is a talk station: when music isn't ai it stays talk unless you give it a playlist.
; Ctrl+Alt+/ in the game swaps between the AI songs and this setup, for this session only.
music            = ai
; Per station, by station id (empty = `music` above). Example: your music everywhere, AI songs on one:
;music_bright-lights  = ai
; A playlist for one station, instead of its genre. What you write decides how it plays:
;   a folder, or an .m3u / .m3u8 file -> your files, every one of them (no genre filter)
;   spotify:playlist:<id>, an https://open.spotify.com/playlist/<id> link, or any https:// link to
;   a playlist on another service -> the station uses your music app; Ctrl+Alt+; opens the link
; (only used when the station isn't on ai; a path with " #" or " ;" in it goes in "quotes". An .m3u's
; network entries, \\server\share\..., play only from the playlist's own share or library_folders)
;playlist_crash-radio = D:\Music\Rock
;playlist_orbit       = C:\Users\Public\Music\chill.m3u8
;playlist_the-block   = https://open.spotify.com/playlist/2GVidj90mznkvs0a5yiwUJ
; The built-in Spotify playlist per station (opened by Ctrl+Alt+; when a service station has no
; playlist_ of its own; public playlists, checked 2026-11-13, their owners can change them):
;   bright-lights    spotify:playlist:2TPSN1YevBfAAx2Y6gzPJ6  KIDZ BOP Ultimate Kids Playlist (clean)
;   crash-radio      spotify:playlist:6TeyryiZ2UEf3CbLXyztFA  Classic Rock Greatest Hits (2 explicit)
;   bluebell-country spotify:playlist:00vLleInGPMFwWamNV9zxR  Bluegrass Time (clean)
;   orbit            spotify:playlist:0vvXsWCC9xrXsKd4FyS8kM  Lofi Girl - beats to relax/study to (clean)
;   boogie-brick     spotify:playlist:2ogAVuTJqtu2jdkHtLtT4D  DISCO FEVER (clean)
;   the-block        spotify:playlist:2GVidj90mznkvs0a5yiwUJ  Clean Old School Hip Hop, radio edits (4 explicit)
;   paradise-sound   spotify:playlist:1l2pthXkHmV4JAnrPotrei  Trojan Records 50 years of Reggae and Ska (clean)
;   kings-court-classical spotify:playlist:37i9dQZF1DWWEJlAGA9gs0  Classical Essentials (clean)
; For kids: in Spotify, Settings > Explicit Content > turn off "Allow playback of explicit-rated
; content". Don't stream or broadcast the game while a music service plays.

; -- library: your music files --
library_folders    =         ; where your music is, folders separated by |  (empty = your Windows Music library)
library_min_tracks = 8       ; a station needs this many tracks of its genre...
library_short      = talk    ; ...with fewer it is: talk (DJ, ads and news only) | ai (the AI songs)
library_skip       = horrorcore, gangsta, drill   ; genres never played (a family default; empty = none)
library_holiday    = season  ; Christmas music: season (December only) | always | never
