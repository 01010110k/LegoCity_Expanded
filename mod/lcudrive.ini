; =============================================================================================
;  lcudrive.ini - LEGO City Undercover driving overhaul. Saved changes apply within a second.
;
;  In game:   ]  lcudrive ON (rising beep)        [  stock handling (falling beep)
;             the game's car keys: J accelerate, K brake (reverse once stopped), A/D steer
;             Space / controller RB = handbrake (lcudrive's own; the game's brake now really brakes)
;             Ctrl+Alt+P / Ctrl+Alt+O = scripted test pass (straight line / handling)
;             Ctrl+Alt+C = cruise at 5 u/s while you steer (again = stop)
;             Ctrl+Alt+T telemetry on/off   Ctrl+Alt+R reload this file
;             Pause or Ctrl+Alt+U = unhook everything for this session (always works)
;
;  Only YOUR car is affected; traffic drives the stock model. Each car keeps its own character
;  (stock top speed, power, steering lock and tyre grip set the starting point), then lcudrive
;  gives it a real engine and gearbox, quadratic aero drag instead of the stock syrup, load-
;  sensitive tyres with weight transfer, and a steering rack that is quick at low speed and
;  calm at high speed.
; =============================================================================================
[general]
; boot state of the ] / [ toggle
enable = 1
; the computer beeps the mod makes (] and [, the hotkeys, the plane's gear and stall warnings):
; 0 = silent, 1 = on. The log still says what each key did.
beeps = 0
; [station1] the pause menu's "Return to Police Station": outside = only the player who picks it
; is moved to the pavement outside the police station (fade, no loading screen, the other player
; plays on; the spot is [wanted] busted_outside_x/_y/_z/_heading); stock = the game's own trip
; into the station lobby (a level change: BOTH players, the long load). Mod Options: Bikes and Jetpack
station_return = outside
; feed speed + headlight frame to 3Dmigoto (speed motion blur)
bridge = 1
bridge_speed = 30
; record lcudrive_telemetry.csv every frame while you drive (Ctrl+Alt+T toggles at runtime)
telemetry = 0
; handbrake key, a Windows virtual-key code: 0x20 Space, 0xA0 Left Shift, 0xA2 Left Ctrl, 0 = none
handbrake_key = 0x20
; controller handbrake button: A B X Y LB RB LT RT LS RS BACK START DUP DDOWN DLEFT DRIGHT NONE
; (NONE by default: RB is the game's own car jump. Steering, throttle and brake/reverse come from
; the game's own controller mapping as usual.)
pad_handbrake = NONE
; accelerator + brake together while rolling forward = handbrake (RT+LT on a pad, J+K on the
; keyboard): a power slide - the rear lets go but keeps driving, so you keep your speed. 0 = off
pedal_handbrake = 1
; the brake with the steering wound on past this (0..1), above ~6 u/s: the rear lets go into a
; drift, like the game's own power slide (add throttle to hold it). Braking with the wheel nearer
; straight still brakes. 0 = the brake always brakes
brake_drift = 0.7
; analog steering: centre deadzone, and response curve (1 = linear, higher = finer near centre;
; a keyboard's full left/right is unaffected)
stick_deadzone = 0.10
steer_curve = 1.5
; the game turns its brake button into a HANDBRAKE while you roll forward. 1 = make it a real
; brake (reverse once stopped); 0 = keep the game's power-slide brake
brake_key_brakes = 1
; engine sound follows lcudrive's engine (rpm, gears). 0 = leave the stock sound logic alone
engine_sound = 1
; [missions1] Missions: stock game (Notes 68). While a story mission runs (and, with mission_stock_side,
; a race, time trial, gang fight, robber garage, vehicle theft or construction job), the mod's gameplay
; changes stand down exactly as if switched off here: police / wanted, street life, people, animals,
; spawned vehicles, T-Rexes, the airliner, jetpack upgrade, rare shark, BlockRooms door, split cut-scenes,
; and - once your car or aircraft is safe to hand over (on foot, slower than mission_stock_safe_speed,
; or a cut-scene) - the car / bike handling and the helicopter / plane flight models. Graphics, lights,
; weather, the radio and the crash guards stay on. Everything returns when the mission is over.
mission_stock = 1
mission_stock_side = 1
; seconds the mission signal must hold before anything is suspended / be gone before it all returns
mission_stock_enter = 2.0
mission_stock_exit = 6.0
; u/s: a vehicle is only handed between the mod and the game slower than this
mission_stock_safe_speed = 3.0
; the mission-news detector: s a new story position must hold; s after a load before news counts;
; s without a player (the title screen) that mean a new save may come
mission_detect_stable = 1.0
mission_detect_settle = 8
mission_detect_absent = 6

[feel]
; 1.0 = as tuned. Everything below is relative to each car's own baseline.
power            = 0.75  ; engine power (was 1.0; lowered so the police can keep up). In a drift
                         ; the engine gets the 1.0 power back, so slides don't die
top_speed        = 0.85  ; top speed (gearing + aero drag); 1.0 = ~1.65x the stock top speed, 0.85 = ~1.4x
grip             = 1.0   ; tyre grip everywhere
balance          = 0.0   ; -1 loose tail ... 0 neutral-safe ... +1 planted tail
brakes           = 1.0
steer_speed      = 1.0   ; how fast the wheels turn
steer_lock       = 1.0   ; how far they turn (at speed the lock tracks the grip limit)
weight           = 1.0   ; weight transfer (0 = even loads like the stock car)
handbrake        = 1.0   ; handbrake: how loose the rear goes (it brakes only lightly - you keep speed)
drift            = 0.6   ; drift assist: in a slide on the throttle, your steering sets the drift
                         ; angle (into the turn = more, countersteer = less / out) and the rear's
                         ; grip follows it; lift off to straighten. 0 = raw physics, 1 = easiest
breakaway        = 1.0   ; how much grip drops once a tyre slides (0 = none, 2 = snappy)
traction_control = 0.5   ; 0 = burnouts and power slides, 1 = no wheelspin at all
yaw_damping      = 0.30  ; solver rotation damping on your car (the stock value is 1.0)
yaw_inertia      = 0.85  ; x stock yaw inertia (the engine itself adds 1.5x at spawn)
stability        = 0.5   ; damps turn-in overshoot at speed (0 = raw, 1 = very settled)
size_effect      = 1.0   ; long / heavy vehicles (limo, bus, truck) steer like their size:
                         ; wider turning circle, slower wheel, more inertia, a bit less grip
                         ; (0 = off; 2 = double; ordinary cars are unaffected either way)

[lights]
; real headlights: the game's own lamps, switched to dynamic lights on YOUR car at night
; (the old shader cones are turned off while this is on). 0 = off, 1 = at night (follows the
; day/night cycle), 2 = always on (handy for testing in daylight)
headlights          = 1
; at night, every car shows its headlight glow (the way the game's own night levels look)
traffic_lights      = 1
headlight_range     = 30    ; how far the light reaches (the visible beam meshes keep their stock size)
headlight_fov       = 55    ; beam width, degrees
headlight_intensity = 1.6   ; brightness (x the car's own lamp colour)
night_below         = 0.06  ; sun height (-1..1) under which it counts as night; higher = earlier
; beam shape: the game's own headlight beam texture is missing from the PC data, so each lamp
; projects its own flare texture instead (2). 1 = the bulb (untextured on the cars checked so
; far: no beam), 0 = none (glow only)
headlight_cookie    = 2
; the lamp's visible beam: a short see-through wedge in front of each headlight, about one car
; long, that ends in a hard flat edge. 0 = hidden on your car (the light on the road stays),
; 1 = shown as the game ships it
headlight_beam      = 0
; a few cars' headlights are turned round in the game's own data (the Sphinx's and the Brute's
; shine backwards, the Arbalest saloon's straight up - nobody saw it while the lamps cast no
; light). 1 = on your car such a lamp is turned to shine ahead (its glow stays where it is),
; 0 = every lamp as the game has it
headlight_autofix   = 1

[streetlamps]
; real light under the street lamps: at night every lamp near you casts a pool of light on the
; road and the pavement, the way your headlights light the road (the game's own lights, 1,104 lamp
; posts across the city). They come on with the lamp glass at dusk and go off with it at dawn.
; In co-op each player gets the lamps around them. [ (stock) and Ctrl+Alt+U switch them off too.
; 0 = off, 1 = at night, 2 = test: one plain light at player 1's feet, day or night
streetlamps    = 1
max_lights     = 64     ; lamps lit at once, shared between the players (at most 96; fewer = cheaper)
lamp_radius    = 3.0    ; how far one lamp's light reaches (u); the bigger lamps reach a little further
lamp_range     = 35     ; lamps this close to you are lit (u); they fade out towards the edge - or
                        ; nearer, where your share of max_lights runs out first (busy streets in co-op)
lamp_intensity = 1.0    ; brightness
lamp_falloff   = 0.02   ; how the light dims towards the edge of its reach (the game's own default)
lamp_head_drop = 0.1    ; the light sits this far below the lamp head, so the pole top isn't blown out
lamp_fixtures  = 0      ; 1 = wall lights, garden bollards and small lanterns as well
; colours as the game takes them, r, g, b (the light is the square of each: 1.0 0.79 0.53 = sodium)
colour_sodium  = 1.0, 0.79, 0.53   ; the tall street lamps
colour_white   = 1.0, 0.93, 0.84   ; park lamps, wall and garden lights
colour_lantern = 1.0, 0.59, 0.35   ; Chinese lamp posts and paper lanterns
log            = 0      ; 1 = one line a second in lcudrive.log: what the lamps are doing

[heli]
; a physical helicopter: real gravity and rotor thrust, the stick tilts it (tilting is what moves
; it), it can land on anything and tip over on a bad landing. Only the helicopter YOU fly.
; ] / [ switch it with the cars (and [ brings the game's flight limits back). 0 = the game's
; own helicopter.
enable       = 1
top_speed    = 45    ; u/s level flight at full forward stick
max_tilt     = 34    ; deg of nose-down / bank at full stick (more = gets to speed quicker)
climb_rate   = 6     ; u/s at full ascend
descend_rate = 8     ; u/s at full descend (always flares to a soft touchdown near the ground)
thrust_g     = 2.0   ; rotor thrust capacity in g (how hard it can climb or stop a descent)
yaw_rate     = 100   ; deg/s turning at full stick
turn_bank    = 0.6   ; how much it banks into turns (0..1)
brake_assist = 0.7   ; tilts back to stop when you let go of the stick (0 = drifts on)
response     = 0.15  ; s, how quickly it settles on the attitude you ask for
land_height  = 0.35  ; height above ground that counts as touching down
; if a control works backwards, flip its sign here
yaw_sign     = 1
fwd_sign     = 1
vert_sign    = 1
stick_direct = 1     ; controller: the left stick flies it directly - up = forward, back = back, sideways = turn (0 = the game camera-relative steering)
; getting out (the game's enter/exit button) works anywhere, not just on helipads:
;   down, or hovering low and slow  -> it lands and parks right there, and you get out
;   anywhere else                   -> you jump out and fall; the empty helicopter spins down
;                                      and crashes (and explodes if it hits hard)
; a mission that needs you aboard still keeps you in. Helipads and crash mats work as before.
exit_anywhere  = 1
bail_out       = 1     ; 0 = off the pads you can only get out once you are down
park_height    = 1.2   ; at or below this height (and slow) getting out parks it instead
crash_spin     = 5     ; how fast an abandoned helicopter spins on the way down (0 = it just drops)
wreck_on_crash = 1     ; an abandoned helicopter that hits the ground hard explodes (the game's own
                       ; explosion); 0 = it just lies there
crash_speed    = 6     ; how hard (u/s) it has to hit for that (a fall of more than 2 s always does)
; the game never damages a helicopter in a collision; lcudrive does, through the game's own health
; (4 points; at 0 it explodes): a crash at damage_speed costs 1, twice that 2, 2.7x destroys it
crash_damage   = 1     ; 0 = crashes while flying cost nothing (the game's own behaviour)
damage_speed   = 7     ; u/s impact for the first point (7: a full-speed descent into the ground; 19 = destroyed)
; after jumping out in the air: press JUMP while falling and a parachute opens (the game's own,
; from its skydiving missions; steer it with the stick, it puts itself away when you land).
; Don't press and you just fall. 0 = never
parachute      = 1
; no invisible walls: the game turns you around at the map's edges and the mountains, stops
; your climb at height 35, and in places will not let you descend below a set height. 1 = none
; of that (the city's real walls and buildings still collide). 0 = the game's own limits.
free_flight    = 1

[plane]
; the Hover-class "aircraft" (AIRCRAFT_CLOUD is a jetpack, _HERA a helicopter, _JUPITER the Invader
; saucer, _UFO a saucer pod - unlock them in Extras with the codes MBRZHV, NGQCTT, YJMSJN, NZZJNN and
; call them in at a helipad) can fly with the fixed-wing model instead of the helicopter's: lift from
; the wings, a stall, take-off and landing on a virtual gear. None of them is an aeroplane, so by
; default none does (models empty = they fly as helicopters, as before 2026-11-13). The real
; aeroplane is [airplane] below. Everything else about these is the helicopter's (getting in and
; out, the parachute, no walls).
enable         = 1
models         =                          ; which of them (the name after AIRCRAFT_), or all; empty = none
; on a controller: left stick = bank and pitch (pushed forward = nose down), RT = more throttle,
; LT = less throttle (the throttle stays where you leave it) and on the ground the brakes
stick_direct   = 1
; crashes cost health (4 points; at 0 it explodes): a hit at damage_speed costs 1, twice that 2,
; 2.7x destroys it; a hard landing costs 2, a wingtip 1, nose-first at speed destroys it
crash_damage   = 1
damage_speed   = 7.5
; calibration (-1 = the airframe's own): flip a sign if a direction is reversed; gear_height = how
; high the wheels hold the hull; auto_level = how fast a centred stick levels the wings;
; level_path_rate = how fast a centred stick levels a climb or dive
turn_sign      = 1
fwd_sign       = 1
gear_height    = -1
auto_level     = -1
level_path_rate = -1
; the airport planes: while you are near the airport, aeroplanes wait there - one on the runway (the
; long flat quay along the airport's north shore, nose toward the sea, east) and the others on the
; apron just south of it, between the parked scenery planes. Any of them: get in, taxi onto the quay,
; full throttle toward the sea, pull back at about 15 u/s, climb out over the water; land the other
; way, in from the sea, touching down right after the quay edge and braking (LT). Two players can
; each take one. A plane you leave somewhere else fades once you are airport_leave away; a wreck fades
; after 6 s; its stand gets a fresh one. Ctrl+Alt+F (or Mod Options > Call the Airliner) puts a fresh
; plane on EVERY stand whose plane is gone (the one you sit in and the ones already on their stands
; stay): high beeps = done; a low beep = refused (nobody at the airport, a story mission, or someone
; standing on the stand). On only while [airplane] flies airport_model (or [plane], for a Hover
; model). 0 = off
airport        = 1
airport_count  = 3                  ; how many stands have a plane, 1..6: 1 = only the runway start (as before),
                                    ; 2-3 = + the two apron stands by the quay, 4-6 = + the east pier and the south apron
airport_model  = Aircraft_Elifant   ; the airliner, flown by [airplane]; also what stands in for a model below that is missing
; one model per stand, in order (runway start, quay apron, middle apron, east pier, south apron x2).
; Aircraft_Pegasus (the small blue jet) and Aircraft_ThunderRoc (the green four-propeller plane) exist
; only with the planes PATCH.DAT installed; without it the log says so and an Elifant stands there
airport_models = Aircraft_Elifant, Aircraft_Pegasus, Aircraft_ThunderRoc, Aircraft_Elifant, Aircraft_Pegasus, Aircraft_ThunderRoc
airport_pin    = DefaultVehicle     ; map icon: DefaultVehicle (draws a train icon), LcudrivePlane (an aeroplane;
                                    ; needs the staged PATCH.airplane_v1_pin.DAT), empty = none
airport_near   = 90                 ; u from a stand: a player this close gets a plane on it
airport_far    = 220                ; u: nobody this close and nobody aboard -> the waiting plane fades out
airport_leave  = 60                 ; u: a plane left elsewhere fades once nobody is this close (after 10 s)

[airplane]
; Real aeroplanes on their own wheels (airplane.h): taxi, take-off roll, rotate, climb out, land, brake.
; Controller: left stick = bank / pitch (pushed forward = nose down), RT / LT = throttle lever up / down
; (it stays where you leave it); on the wheels LT is also the brakes, and with the lever at idle the
; reverser. Keyboard (player 1): A/D bank, J/K lever, W/S nose down/up.
; Getting in and out: the game's own car buttons. Out high in the air (if the game lets you): JUMP
; while falling opens a parachute, and the empty plane glides down and crashes.
enable         = 1
models         = ELIFANT, PEGASUS, THUNDERROC   ; car-class vehicles that fly (the name after AIRCRAFT_); the last two
                           ; exist only with the planes PATCH.DAT (harmless without it)
stick_direct   = 1         ; a controller flies it directly (0 = the game's own steer / throttle fields)
steer_sign     = 1         ; nose-wheel direction; -1 if it steers the wrong way (the log says so)
turn_sign      = 1         ; bank direction in the air
fwd_sign       = 1         ; pitch direction (forward = nose down)
rotate_deg     = 8         ; most nose-up attitude on the main wheels, 2..9 (the tail touches at 11)
side_grip      = 1.0       ; tyre side friction
rolling        = 0.015     ; rolling resistance
brake_mu       = 0.7       ; main-wheel brakes
reverse_g      = 0.3       ; reverse thrust at idle lever + LT, on the wheels above 2 u/s (0 = none)
; taxiing backwards (stuck nose-first against something?): standing still on the wheels with the
; lever at idle, keep LT (keyboard: K) held - after a moment the plane backs up slowly, up to this
; speed. Steer as usual: stick left swings the tail left, like reversing a car. Let go of LT and it
; rolls to a stop; any throttle cancels it at once. Never in the air, never on the belly.
taxi_reverse_speed = 3     ; u/s, 0..8 (0 = the planes never back up)
crash_damage   = 1         ; bad touchdowns cost health (collisions use the game's own car damage)
crash_destroy_speed = 15   ; u/s: flying into something this hard (the plane's speed changes by this much at once),
                           ; or hitting the ground sinking half this fast, blows the plane up outright. Cruise is
                           ; about 30-55, so any head-on crash does it; a rough landing or a scrape does not. 0 = off
max_velocity   = 25        ; written into the plane's own definition: collision damage starts at 0.3x this (7.5 u/s),
                           ; destroys at 0.8x (20 u/s); also the speed the camera has fully pulled back. 0 = leave it
cam_height     = 1.6       ; chase camera when slow (0 = leave the definition's)
cam_distance   = 6.5
cam_height_fast   = 2.2    ; ... at max_velocity
cam_distance_fast = 9.0
abandon_glide  = 1         ; a plane left in the air glides down empty (throttle shut) until it hits something
bail_parachute = 1         ; getting out in the air arms the parachute (JUMP to open)
force_lod1     = 0         ; an EXPERIMENT, off: 1 = a player's plane on reduced simulation (sim LOD 5) on the
                           ; wheels is held at full simulation; turn it on only if the log says "stood down - sim
                           ; LOD 5 on the wheels" (switches itself off for the session if the hold does not stick)
stall_horn     = 1         ; double beeps while the wing is stalled
engine_rpm     = 1         ; drive the engine sound's RPM from the lever (silent unless the record names engine sounds)
; the landing gear: IN THE AIR the HORN button (controller LB or the left stick pressed, or the
; keyboard's horn key) puts the gear up, and down again (it honks as well; two rising beeps = up, two
; falling = down). Gear up = less drag: flat out it does gear_up_top_speed instead of 45. On the
; ground the horn is just the horn and the gear stays down. Landing with the gear up is a belly
; landing: 1 point of damage + 1 per gear_belly_speed of speed (4 = destroyed), no wheels, it slides
; to a stop on its hull, and once stopped the gear comes down again so you can taxi. The gear is
; drawn going up into the hull as it travels (gear_visual): the Elifant's wheels (its legs are part
; of the hull's model and stay), and with the planes3 PATCH.DAT the wheels AND legs of the Pegasus
; and the ThunderRoc (their wheels do not visibly turn on the ground: the legs hang on the same joints).
gear_retract   = 1         ; 0 = the gear always stays down
gear_up_top_speed = 56     ; u/s level at full lever with the gear up, 45..67.5 (gear down: 45)
gear_time      = 2.0       ; s the gear takes to travel
gear_belly_speed = 10      ; belly landing damage: 1 + speed / this (a 15 u/s arrival = 2 of its 4 points)
gear_belly_decel = 5       ; u/s^2 the hull loses sliding on the ground
gear_auto_down = 0         ; 1 = the gear comes down by itself when low and descending
gear_warn_height = 6       ; u: fast low beeps while the gear is up this low over the ground and you are descending (0 = off)
gear_visual    = 1         ; 0 = the gear is always drawn down (it still works: drag, belly landing)
; the propeller plane (Aircraft_ThunderRoc, with the planes2 PATCH.DAT): its four propellers idle while
; someone sits in it, speed up with the throttle and the airspeed, and run down when it is left.
props          = 1         ; 0 = the propellers stand still
skid_fix       = 1         ; 1 = tyre marks, squeal and smoke only when a plane really skids (touchdown, hard braking
                           ; at speed, sliding sideways); 0 = the game's own rule (it "skids" whenever it rolls fast)
prop_idle      = 2.0       ; turns per second at idle, 0..8
prop_max       = 7.0       ; turns per second at full power, up to 8 (faster would look stopped or backwards)

[bike]
; stunts on the motorbike you ride. The lean is the controller's LEFT STICK up/down, or W / S
; on the keyboard (the game drives with J / K / A / D, so those two are free while riding):
;   wheelie  - rolling, on the throttle, pull back: the front comes up (how far = how far back);
;              let go and it comes down
;   stoppie  - braking hard, push forward: the back comes up
;   in the air (a ramp, or the jump button): pull back = backflip, push forward = front flip,
;   steer = spin. Land it on the wheels...
; the lean into turns and the tyres' grip stay the game's own. 0 = the game's own bike.
enable        = 1
wheelie_speed = 4     ; u/s you need before pulling back lifts the front
wheelie_angle = 26    ; how high a full pull-back takes the front (deg). The bikes' collision box
                      ; reaches past the back wheel: if it touches the road, lcudrive learns that
                      ; bike's limit on the spot and stops just under it (log: "collision box")
stoppie_angle = 22    ; how high a full push lifts the back while braking (deg)
air_flip      = 11    ; how fast the stick flips it in the air (0 = no flips)
air_spin      = 8     ; how fast steering spins it in the air (0 = no spins)
lean_keys     = 1     ; 0 = the keyboard's W / S do nothing on a bike
; the engine: lcudrive drives the back tyre (the game's own bike engine tops out near 6.5 u/s;
; lcudrive's cars do ~20), with real air drag instead of the game's speed syrup
drive         = 1     ; 0 = the game's own engine
top_speed     = 17    ; u/s flat out
grip          = 1.0   ; the turn the tyres hold, in g: limits the steering at speed and stops spin-outs (0 = off)
power         = 1.0   ; acceleration (x)
brake_slide   = 0     ; 1 = the brake button is the game's power slide again (it spins the bike out
                      ; at speed); 0 = it just brakes

[jetpack]
; the astronaut's jetpack (jump, then jump again in the air and hold)
enable        = 1     ; 0 = the game's own jetpack
height        = 1.1   ; how high it climbs above where you pressed (the game's own: 0.55)
time          = 6.0   ; seconds of fuel (the game's own: 1.5)
resume        = 1     ; let go, then press and hold again in the air: it carries on with the
                      ; fuel that's left (the game makes you land first)
keep_ceiling  = 1     ; ...but a resume never climbs above the first take-off's height
unlimited     = 0     ; 1 = no height limit: hold JUMP and you keep climbing until the fuel runs out (fuel = how high)
climb_speed   = 3.0   ; how fast it climbs without a limit, units a second

[wanted]
; GTA-style police. Crimes raise the heat: five LEGO bricks under your hearts show it (the next
; brick fills as it builds; they blink while you're shaking the police off). The police traffic around
; you joins the chase and rams you; get 5 u past the radius and they drop out; out of sight for
; long enough, the level drops one brick at a time.
;   1: police cars   2: + more, and Troopers   3: + police motorbikes   4-5: more of each
; On the water (in a boat, or swimming) police boats come out too - see boats below.
; At 4 a police helicopter joins in, two at 5 - see heli below.
; On foot, chasing officers stun you (levels 1-2) or tie you up with a grapple (3+). Down with the
; police right there - or stopped in a vehicle with them at your door - is BUSTED: you lose studs
; and go back to the police station. Nothing happens during story missions.
; Ctrl+Alt+L steps the level 0 -> 5 -> 0 by hand (one beep per level, a low beep = 0).
; Co-op: each player has a wanted level and a meter of their own - one can be wanted and the other
; not; a crime only counts for the player who did it. The police are one force: when both are
; wanted they are shared out (the higher level gets the first cars and the motorbikes, the other
; player the Troopers; the boats go to whoever is on the water). The officers on foot and the
; helicopters only go after the player with the higher level. Ctrl+Alt+L sets both players; the
; pause menu's Set Wanted Level sets the player who paused.
enable          = 1
crimes          = 1     ; crimes raise the level (0 = only Ctrl+Alt+L)
; heat per crime (one brick = 1.0). Each brick is harder to earn than the last: a crime counts
; 1 / (1 + level_damp x the level you're at). With these numbers, running people over in front of
; the police: 3 for one brick, 7 for two, ~15 for three, ~25 for four, ~38 for five.
crime_run_over   = 0.4  ; running over a pedestrian
crime_ram_police = 0.6  ; ramming a police car (only when YOU were moving: 4 u/s or more)
crime_wreck      = 0.4  ; wrecking your vehicle
crime_steal_car  = 0.5  ; stealing a car (a driver pulled out) - in any outfit but the police uniform
crime_steal_police = 0.8 ; ...a police car. Parked / empty cars are never a crime (nobody sees them go)
crime_hit_cop    = 0.8  ; hitting a police officer (once per officer)
crime_hit_person = 0.2  ; hitting anyone else who isn't a crook (crooks are fair game)
crime_punch      = 0.15 ; punching a pedestrian in the crowd
