[pteranodon]
; The Pteranodon flies. Get on one (the lookout on Port Atlas, [dino] model2) and press JUMP (A): it
; leaps off and beats its wings. In the air:
;   A            a wingbeat - hold it to keep flapping and climb; tap it for a quick lift
;   left stick   left / right banks it into a turn; forward dives (speed builds), back climbs (speed
;                bleeds away - too slow and it stalls: the nose drops until it has speed again)
;   keyboard     (player 1) W / S dive / climb, A / D turn, the jump key flaps
; Let go and it glides down gently. Touch the ground (not climbing) and it lands where it is. It never
; swims: the sea, and any water the game reports, is skimmed and bounced off; one walked into the
; water flaps straight out. A wall stops it - no damage. Run off a ledge and it opens its wings by
; itself. Get off in the air and you fall with a parachute that opens by itself (JUMP opens it
; sooner); the riderless Pteranodon glides down on its own. Each player flies their own, with their
; own controller. [ = stock (it walks), and so does enable = 0.
enable     = 1
creature   = pteranodon ; a ridden creature whose definition name holds this flies
cruise     = 11         ; u/s: the hands-off glide speed
stall      = 5.5        ; u/s: slower than this the wings stop carrying it
max_speed  = 26         ; u/s: the fastest dive
glide      = 6          ; deg: the hands-off glide slope (it sinks about cruise x sin(glide), ~1.1 u/s)
climb      = 24         ; deg: the path with the stick fully back
